<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile | Evenzo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#953553;--bg:#f8f9fa;--sw:260px}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--bg);display:flex;min-height:100vh}
.sidebar{width:var(--sw);background:var(--primary);height:100vh;position:fixed;left:0;top:0;color:#fff;padding:20px;display:flex;flex-direction:column;z-index:1000}
.sidebar .logo{font-size:26px;font-weight:bold;text-align:center;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:18px;margin-bottom:28px}
.nav-item{padding:13px 15px;margin-bottom:8px;border-radius:8px;display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.8);text-decoration:none;transition:.3s;font-size:15px}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.15);color:#fff}
.logout-box{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.1)}
.main{margin-left:var(--sw);width:calc(100% - var(--sw));padding:40px;display:flex;justify-content:center}
.form-card{background:#fff;border-radius:14px;padding:36px;box-shadow:0 4px 15px rgba(0,0,0,.07);width:100%;max-width:520px}
.form-card h2{color:var(--primary);margin-bottom:26px;font-size:22px;display:flex;align-items:center;gap:10px}
.fg{margin-bottom:18px}
.fg label{display:block;font-weight:600;font-size:13px;margin-bottom:7px;color:#555}
.fg input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}
.fg input:focus{border-color:var(--primary)}
.fg input[readonly]{background:#f5f5f5;color:#888}
.btn{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;transition:.2s}
.btn:hover{opacity:.88}
.flash-wrap{position:fixed;top:20px;right:20px;z-index:9999;max-width:400px}
.flash-msg{padding:14px 18px;border-radius:8px;font-weight:bold;display:flex;align-items:center;gap:10px;box-shadow:0 8px 25px rgba(0,0,0,.13);background:#fff;border-left:5px solid #2e7d32;margin-bottom:10px;color:#333}
</style>
</head>
<body>
<div class="flash-wrap">{% with messages=get_flashed_messages() %}{% if messages %}{% for m in messages %}
<div class="flash-msg"><i class="fas fa-check-circle" style="color:#2e7d32"></i> {{ m }}</div>
{% endfor %}{% endif %}{% endwith %}</div>
<div class="sidebar">
  <div class="logo">Evenzo</div>
  <nav>
    <a class="nav-item" href="{{ url_for('user_dashboard') }}"><i class="fas fa-home"></i> My Dashboard</a>
    <a class="nav-item active" href="{{ url_for('user_edit_profile') }}"><i class="fas fa-user-edit"></i> Edit Profile</a>
    <a class="nav-item" href="{{ url_for('index') }}"><i class="fas fa-arrow-left"></i> Home</a>
  </nav>
  <div class="logout-box"><a class="nav-item" href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
</div>
<div class="main">
  <div class="form-card">
    <h2><i class="fas fa-user-edit"></i> Edit Profile</h2>
    <form method="POST" action="{{ url_for('user_edit_profile') }}">
      <div class="fg"><label>Full Name</label><input name="full_name" value="{{ user.full_name }}" required></div>
      <div class="fg"><label>Email (cannot change)</label><input value="{{ user.email }}" readonly></div>
      <button type="submit" class="btn">Save Changes</button>
    </form>
    <div style="text-align:center;margin-top:18px">
      <a href="{{ url_for('user_dashboard') }}" style="color:var(--primary);text-decoration:none;font-size:14px"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => document.querySelectorAll('.flash-msg').forEach(f => { f.style.opacity='0'; setTimeout(() => f.remove(), 400); }), 4000);
});
</script>
</body>
</html>
