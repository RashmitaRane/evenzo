<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Evenzo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #953553; --bg-light: #f8f9fa; --sidebar-width: 260px; }
        body { background-color: var(--bg-light); display: flex; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        .sidebar { width: var(--sidebar-width); background-color: var(--primary); height: 100vh; position: fixed; color: white; padding: 20px; display: flex; flex-direction: column; z-index: 1000; }
        .nav-item { padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 15px; color: rgba(255,255,255,0.8); text-decoration: none; }
        .nav-item:hover, .nav-item.active { background-color: rgba(255,255,255,0.15); color: white; }

        .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); padding: 40px; }
        .profile-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 800px; margin: 0 auto; }
        
        .avatar-container { text-align: center; margin-bottom: 30px; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary); margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 48px; color: white; background-color: var(--primary); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        
        .save-btn { background: var(--primary); color: white; padding: 12px 30px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 20px; }
        .save-btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo" style="font-size: 28px; font-weight: bold; margin-bottom: 40px; text-align: center;">Evenzo</div>
        <nav>
            <a href="{{ url_for('dashboard') }}" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
            <a href="{{ url_for('dashboard') }}" class="nav-item"><i class="fas fa-calendar-check"></i> Bookings</a>
            <a href="{{ url_for('edit_profile') }}" class="nav-item active"><i class="fas fa-user-edit"></i> Edit Profile</a>
            <a href="{{ url_for('portfolio') }}" class="nav-item"><i class="fas fa-images"></i> Portfolio</a>
        </nav>
        <a href="{{ url_for('logout') }}" class="nav-item" style="margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1);"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <div class="main-content">
        <div class="profile-card">
            <h2 style="color: var(--primary); margin-bottom: 30px; text-align: center;">Account Settings</h2>
            
            <form action="{{ url_for('edit_profile') }}" method="POST" enctype="multipart/form-data">
                <div class="avatar-container">
                    {% if user.profile_pic %}
                        <img src="{{ url_for('uploaded_file', filename=user.profile_pic) }}" class="avatar">
                    {% else %}
                        <div class="avatar">{{ user.full_name[0]|upper }}</div>
                    {% endif %}
                    <label for="profile_pic" style="cursor: pointer; color: var(--primary); margin-top: 10px; display: inline-block;">Change Photo</label>
                    <input type="file" id="profile_pic" name="profile_pic" accept="image/*" style="display:none">
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="full_name" value="{{ user.full_name }}" required>
                    </div>
                    <div class="form-group">
                        <label>Business Email</label>
                        <input type="email" name="email" value="{{ user.email }}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone" value="{{ user.phone }}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Business Name</label>
                        <input type="text" name="business_name" value="{{ user.business_name }}" required>
                    </div>
                </div>
                
                <button type="submit" class="save-btn">Update Profile</button>
            </form>
        </div>
    </div>
</body>
</html>
